
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="header">
            <div>
                <p class="tag">calculator</p>
                <h1>DIKSHYANT</h1>
            </div>
            <div class="status">● READY</div>
        </header>

        <section class="display">
            <div id="expression">Ready to calculate</div>
            <div id="result">0</div>
        </section>

        <section class="buttons">
            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="sign">+/-</button>
            <button class="utility" data-action="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>

            <!-- Memory buttons -->
        <button data-action="memory-clear">MC</button>
        <button data-action="memory-recall">MR</button>
        <button data-action="memory-add">M+</button>
        <button data-action="memory-subtract">M−</button>

        <!-- Advanced functions -->
        <button data-action="backspace">⌫</button>
        <button data-action="square">x²</button>
        <button data-action="sqrt">√</button>
        <button data-action="reciprocal">1/x</button>
        </section>

        <footer>DESIGNED FOR EVERYDAY MATH</footer>
    </main>

    <script src="First.js"></script>
</body>
</html>
